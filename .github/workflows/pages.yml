# Publishes the playbook (playbook/) as a static site on GitHub Pages.
# Plain HTML, no build step. Repo Settings → Pages → Source must be "GitHub Actions".
name: Deploy playbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playbook
      - id: deployment
        uses: actions/deploy-pages@v4
