# Runs the blueprint viewer with no local Node required.
#   docker compose up        → http://localhost:3000
#   BLUEPRINT_PORT=3002 docker compose up   → when 3000 is taken by another project
# The whole brainstorm workspace is mounted at /work so the app can read each
# module's CLAUDE.md live (MODULES_DIR=/work). Edit a doc, reload, see it update.
services:
  blueprint:
    build:
      context: ./blueprint
      dockerfile: Dockerfile.dev
    working_dir: /work/blueprint
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      # Host port is configurable: BLUEPRINT_PORT=3002 docker compose up (default 3000)
      - "${BLUEPRINT_PORT:-3000}:3000"
    environment:
      MODULES_DIR: /work
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./:/work
      # Keep build output + installed deps in the container, not on the host bind
      # mount (faster, avoids host/container churn). NOTE: after restarting or
      # rebuilding the dev server, HARD-refresh any open browser tab — Turbopack's
      # dev chunk hashes change on rebuild, so a stale tab loops on ChunkLoadError
      # → reload. A freshly loaded tab is stable (verified). WATCHPACK_POLLING is
      # intentionally absent: it's a Webpack-only var and does nothing for Turbopack.
      - /work/blueprint/.next
      - /work/blueprint/node_modules
