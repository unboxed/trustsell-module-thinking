# Runs the blueprint viewer with no local Node required.
#   docker compose up        → http://localhost:3000
# The whole brainstorm workspace is mounted at /work so the app can read each
# module's CLAUDE.md live (MODULES_DIR=/work). Edit a doc, reload, see it update.
services:
  blueprint:
    build:
      context: ./blueprint
      dockerfile: Dockerfile.dev
    working_dir: /work/blueprint
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    ports:
      - "3000:3000"
    environment:
      MODULES_DIR: /work
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./:/work
