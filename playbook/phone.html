<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Phone · Signal cards</title>
<link rel="stylesheet" href="assets/fonts/inter.css">
<link rel="stylesheet" href="assets/ios-tokens.css">
<link rel="stylesheet" href="assets/ios-components.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="page page--phone">

<main class="page-body">
<!-- The way out: a back link in the top left, nothing else around the phone. -->
<a class="ios-btn phone-exit" href="index.html"><span class="chevron" aria-hidden="true"></span>Cards</a>

<!-- Two halves: an empty placeholder on the left, the phone on the right. -->
<div class="phone-left">
  <h1>Title</h1>
  <p class="phone-left__desc">Description. A few lines about what this screen is and what the seller does on it.</p>
</div>

<div class="phone-right">
<!-- An empty iPhone, 393 x 852 pt. What goes on the screen is not decided yet. -->
<div class="phone-stage">
<div class="phone">
<div class="screen">
  <div class="ios-statusbar" aria-hidden="true">
    <span>9:41</span>
    <span class="ios-statusbar__island"></span>
    <span class="ios-statusbar__indicators">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4.2a10.5 10.5 0 0 1 14 0"/><path d="M3.6 6.9a6.8 6.8 0 0 1 8.8 0"/><path d="M6.2 9.5a3 3 0 0 1 3.6 0"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <!-- Two placeholder menu buttons at the top, one each side. -->
  <div class="screen__top">
    <button class="ios-glass-btn screen__menu" type="button" aria-label="Menu, left"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 5h13M2.5 9h13M2.5 13h13"/></svg></button>
    <button class="ios-glass-btn screen__menu" type="button" aria-label="Menu, right"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><circle cx="3.5" cy="9" r="1.8"/><circle cx="9" cy="9" r="1.8"/><circle cx="14.5" cy="9" r="1.8"/></svg></button>
  </div>
  <div class="screen__content">
    <!-- A deck: the top card fills the screen; two more wait behind it. Swipe left or right to deal it. -->
    <div class="deck">
      <div class="deck__behind deck__behind--2" aria-hidden="true"></div>
      <div class="deck__behind deck__behind--1" aria-hidden="true"></div>
      <article class="card deck__card">
        <h2>Title</h2>
        <p>Description. A line or two about what this card is asking or offering.</p>
      </article>
    </div>
  </div>
  <!-- A placeholder menu: the iOS 26 floating tab bar, three tabs, names to be decided. -->
  <nav class="ios-tabbar screen__tabbar" aria-label="Menu">
    <a class="ios-tabbar__item" aria-selected="true" href="#"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="16" height="12" rx="2.5"/><path d="M6 2.5h10"/></svg>One</a>
    <a class="ios-tabbar__item" href="#"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9.5" cy="9.5" r="6.5"/><path d="m14.5 14.5 5 5"/></svg>Two</a>
    <a class="ios-tabbar__item" href="#"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="8" r="4"/><path d="M3.5 19.5a7.5 7.5 0 0 1 15 0"/></svg>Three</a>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>
</div>
</div>
</div>
</div>

</main>


<script>
/* Scale the phone to fit the viewport's height, never above 1:1. */
(function(){
  function fit(){
    var wide=window.matchMedia('(min-width:561px)').matches;
    var s=wide?Math.max(.5,Math.min(1,(window.innerHeight-120)/852)):1;
    document.documentElement.style.setProperty('--s',s);
  }
  window.addEventListener('resize',fit);fit();
})();
</script>
</body>
</html>
